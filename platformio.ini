; Minimal PlatformIO project for the custom ESP32-S3 e-paper board.
; The GPIO assignments below follow ESP32-S3_ePaper_PinMapping.xlsx.

[platformio]
default_envs = esp32-s3

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 460800

; Keep the first firmware independent of the old application's large data/TTS stack.
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    ; No external libraries are required for the initial hardware bring-up.
